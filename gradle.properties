org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# 默认 WebDAV 配置：装完 APK 首次打开会自动填入这些值（只需填一次，编译时写进 APK）
# 留空则保持空白。CI 里可以用 GitHub Secrets 覆盖（见 .github/workflows/build.yml）
# 注意：仓库是公开的，密码建议放 Secrets（DAV_PASSWORD），不要写在这里
# ---------------------------------------------------------------------------
defaultDavUrl=
defaultDavUser=
defaultDavPassword=
defaultDavRoot=
defaultDavInsecure=false

# 固定签名（与仓库内 keystore/tvwebdavbox.jks 对应，仓库是公开的，仅用于侧载自用）
releaseStorePassword=tvbox2026
releaseKeyAlias=tvwebdavbox
releaseKeyPassword=tvbox2026
