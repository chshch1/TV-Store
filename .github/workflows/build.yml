name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # 推送 v1.2.0 这类 tag 时，额外自动发布 Release
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest 镜像本身已预装 Android SDK（含 platforms/android-35、
      # build-tools/34.0.0）。这里不再调用 setup-android / sdkmanager，少一个失败点；
      # 只有当平台目录确实缺失时才回退安装。
      - name: 定位工程目录
        id: proj
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew -type f -not -path './.git/*' | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::仓库里找不到 gradlew"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "工程目录：$DIR"

      - name: 准备 local.properties 与 SDK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "使用 SDK：$SDK"
          echo "sdk.dir=$SDK" > local.properties

          echo "---- platforms ----"; ls "$SDK/platforms" 2>/dev/null || true
          echo "---- build-tools ----"; ls "$SDK/build-tools" 2>/dev/null || true
          java -version

          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "缺少 platforms/android-35，尝试安装"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || SM=$(command -v sdkmanager || true)
            if [ -n "$SM" ]; then
              yes | "$SM" --licenses > /dev/null 2>&1 || true
              "$SM" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;34.0.0"
            else
              echo "::error::找不到 sdkmanager，无法安装 platforms/android-35"
              exit 1
            fi
          else
            echo "platforms/android-35 已存在，跳过安装"
          fi

      - name: 校验 Gradle wrapper
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ls -la gradle/wrapper
          ./gradlew --version

      - name: 按 tag 同步版本号（仅 tag 触发时执行）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          NEW_NAME="${GITHUB_REF_NAME#v}"
          NEW_CODE="${{ github.run_number }}"
          echo "tag → versionName=$NEW_NAME, versionCode=$NEW_CODE"
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${NEW_CODE}/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '${NEW_NAME}'/" app/build.gradle
          grep -nE "versionCode|versionName" app/build.gradle

      - name: 检查默认 WebDAV 配置是否已注入
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          DAV_URL: ${{ secrets.DAV_URL }}
          DAV_USER: ${{ secrets.DAV_USER }}
          DAV_PASSWORD: ${{ secrets.DAV_PASSWORD }}
          DAV_ROOT: ${{ secrets.DAV_ROOT }}
        run: |
          echo "DAV_URL 已配置：$([ -n "$DAV_URL" ] && echo 是 || echo 否)"
          echo "DAV_USER 已配置：$([ -n "$DAV_USER" ] && echo 是 || echo 否)"
          echo "DAV_PASSWORD 已配置：$([ -n "$DAV_PASSWORD" ] && echo 是 || echo 否)"
          echo "DAV_ROOT 已配置：$([ -n "$DAV_ROOT" ] && echo 是 || echo 否)"
          echo "（只打印有没有，不打印具体值；否 = 回退到 gradle.properties）"

      - name: 编译 Release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          # 没配这些 Secrets 时为空串，build.gradle 会回退到 gradle.properties 里的值
          DAV_URL: ${{ secrets.DAV_URL }}
          DAV_USER: ${{ secrets.DAV_USER }}
          DAV_PASSWORD: ${{ secrets.DAV_PASSWORD }}
          DAV_ROOT: ${{ secrets.DAV_ROOT }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVWebDavBox-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 失败时给出提示
        if: failure()
        run: echo "::notice::构建失败。请展开标红的步骤，把它最后 20 行日志发我定位原因。"

  # 仅当推送 v* tag 时执行：把刚编译出的 APK 作为一个 GitHub Release 发布出去
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: TVWebDavBox-apk
          path: dist

      - name: 列出待发布文件
        run: ls -la dist

      - name: 创建 Release 或补传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release 作业没有检出源码、没有 .git 目录，必须显式告诉 gh 目标仓库
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version
          TAG="$GITHUB_REF_NAME"
          # 幂等：网页上先手动建了 Release，这里只补附件；没建过就新建一个
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，补传 APK"
            gh release upload "$TAG" dist/*.apk --clobber
          else
            echo "Release $TAG 不存在，创建并上传 APK"
            gh release create "$TAG" dist/*.apk \
              --title "TVWebDavBox $TAG" \
              --generate-notes
          fi
          echo "完成：https://github.com/$GH_REPO/releases/tag/$TAG"

